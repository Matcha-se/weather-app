<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/places"></ion-back-button>
    </ion-buttons>

    <ion-title>{{ isEditing ? 'Edit Place' : 'Add Place' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="placeForm" (ngSubmit)="savePlace()">
    <div class="form-card app-card">
      <ion-list lines="none">
        <ion-item>
          <ion-input
            label="Place name"
            label-placement="stacked"
            type="text"
            formControlName="name"
            placeholder="Gapan, Nueva Ecija"
          ></ion-input>
        </ion-item>

        <ion-item>
          <ion-input
            label="Note"
            label-placement="stacked"
            type="text"
            formControlName="note"
            placeholder="Optional note"
          ></ion-input>
        </ion-item>

        <ion-item>
          <ion-input
            label="Latitude"
            label-placement="stacked"
            type="text"
            formControlName="latitude"
            readonly="true"
            placeholder="Tap the button below"
          ></ion-input>
        </ion-item>

        <ion-item>
          <ion-input
            label="Longitude"
            label-placement="stacked"
            type="text"
            formControlName="longitude"
            readonly="true"
            placeholder="Tap the button below"
          ></ion-input>
        </ion-item>
      </ion-list>
    </div>

    <ion-button expand="block" fill="outline" type="button" class="location-button" (click)="useCurrentLocation()">
      <ion-icon slot="start" name="location-outline"></ion-icon>
      Use my current location
    </ion-button>

    <ion-button expand="block" type="submit" class="save-button" [disabled]="isSaving">
      <ion-icon slot="start" name="save-outline"></ion-icon>
      {{ isSaving ? 'Saving...' : (isEditing ? 'Save changes' : 'Save place') }}
    </ion-button>
  </form>

  <p class="hint">Latitude and longitude are filled from your GPS location.</p>
</ion-content>
